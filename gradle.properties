# Keep Gradle daemons small: multiple concurrent invocations (agents, IDE, CI) would otherwise
# reserve 4 GiB heap + 2 GiB metaspace each. Raise on the command line if a build needs more.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# The Kotlin compile daemon needs its own headroom; 1g is not enough for the matcher/payload sources.
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true
android.useAndroidX=true
android.r8.maxWorkers=4
android.r8.gradual.support=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
kotlin.code.style=official
