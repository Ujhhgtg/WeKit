[package]
name = "wekit-zygisk"
version = "0.1.0"
edition = "2024"

[lib]
name = "wekit_zygisk"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
jni = { version = "0.22", default-features = false }
anyhow = "1"
sha2 = "0.11"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
