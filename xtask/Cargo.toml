[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dexsql = { git = "https://github.com/Ujhhgtg/dexsql.git", rev = "9dbebc347782855d8b62177bc1216db4567a5acc" }
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "macros"] }
toml = "1.1"
walkdir = "2"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
