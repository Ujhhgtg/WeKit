[workspace]
members = [
    "crates/wekit-native",
    "crates/wekit-native-common",
    "crates/wekit-zygisk",
    "services/read-receipts",
    "xtask",
]
resolver = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.wekit-zygisk]
strip = "none"
