name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
  workflow_dispatch:
    inputs:
      publish_extensions:
        description: Build and publish all extension packs, including the large Arch rootfs
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.repository == 'Ujhhgtg/WeKit-Dev') ||
      (
        !startsWith(github.event.head_commit.message, '[skip ci]') && 
        (
          github.event_name == 'pull_request' ||
          (github.repository == 'Ujhhgtg/WeKit-Dev' && github.ref == 'refs/heads/master')
        )
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        run: |
          NDK_VERSION=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          MIN_SDK=$(sed -n 's/^minSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          NDK_BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android$MIN_SDK-clang"
          test -x "$NDK_BIN/llvm-strip"

      - name: Prepare PRoot cache key
        id: proot_cache_inputs
        run: |
          echo "commit=$(git -C third_party/proot-static rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(sed -n 's/^ndk = \"\(.*\)\"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
          echo "min_sdk=$(sed -n 's/^minSdk = \"\(.*\)\"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - name: Cache PRoot build
        uses: actions/cache@v6
        with:
          path: target/proot-static
          key: proot-${{ runner.os }}-${{ runner.arch }}-${{ steps.proot_cache_inputs.outputs.commit }}-${{ steps.proot_cache_inputs.outputs.ndk }}-${{ steps.proot_cache_inputs.outputs.min_sdk }}-${{ hashFiles('patches/proot/android-ptrace-events.patch', 'third_party/proot-static/tools/build-static-aarch64.sh') }}
          restore-keys: |
            proot-${{ runner.os }}-${{ runner.arch }}-

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target

      - name: Cache Gradle build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/configuration-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Validate i18n catalogs
        run: |
          cargo test -p xtask i18n_check
          ./x i18n-check

      - name: Build native library
        run: |
          cargo xtask configure
          cargo xtask build --native-only

      - name: Decode keystore
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/wekit-keystore.jks

      - name: Build Release (Signed)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEKIT_KEYSTORE_FILE: ${{ runner.temp }}/wekit-keystore.jks
          WEKIT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WEKIT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WEKIT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --warning-mode all --stacktrace

      - name: Build Release (Unsigned)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleRelease --warning-mode all --stacktrace

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist/apk

          expected_abis=arm64-v8a
          for flavor in standard legacy; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            test -f "$apk"

            actual_abis=$(unzip -Z1 "$apk" 'lib/*/*.so' | cut -d/ -f2 | sort -u)
            if [ "$actual_abis" != "$expected_abis" ]; then
              echo "::error file=$apk::Expected arm64-v8a-only APK, got: $actual_abis"
              exit 1
            fi

            cp -v "$apk" dist/apk/
          done

          echo "Collected APKs:"
          ls -1 dist/apk

      - name: Collect mappings
        run: |
          # One mapping.txt per flavor; rename per flavor to avoid collisions.
          mkdir -p dist/mapping
          for m in app/build/outputs/mapping/*/mapping.txt; do
            flavorDir=$(basename "$(dirname "$m")")   # e.g. standardRelease
            cp -v "$m" "dist/mapping/mapping-${flavorDir}.txt"
          done
          ls -1 dist/mapping || echo "(no mappings — unsigned PR build without minify?)"

      - name: Upload Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: wekit-apk
          path: dist/apk/*.apk

      - name: Upload Release Obfuscation Mapping
        uses: actions/upload-artifact@v7
        with:
          name: wekit-mapping
          path: dist/mapping/*.txt

  build_zygisk:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ needs.build.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        run: |
          NDK_VERSION=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          MIN_SDK=$(sed -n 's/^minSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          NDK_BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android$MIN_SDK-clang"
          test -x "$NDK_BIN/llvm-strip"

      - name: Download Release APK artifact
        uses: actions/download-artifact@v8
        with:
          name: wekit-apk
          path: artifacts

      - name: Build Zygisk module
        run: |
          ./x zygisk build --apk-release --release --skip-apk-build \
            --apk artifacts/app-standard-release.apk

      - name: Upload Zygisk module
        uses: actions/upload-artifact@v7
        with:
          name: wekit-zygisk
          path: wekit-zygisk/release/*.zip
          if-no-files-found: error

  dex-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.repository == 'Ujhhgtg/WeKit-Dev'
    outputs:
      reports-available: ${{ steps.report-check.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib jq unzip
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --retry 3 \
            https://github.com/mgdm/htmlq/releases/download/v0.4.0/htmlq-x86_64-linux.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/htmlq"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Restore fixed WeChat APKs
        id: apk-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/wekit-dex-test-apks
          key: dex-test-apks-v1-${{ runner.os }}-${{ hashFiles('docs/getting-started.md', '.github/scripts/download-dex-test-apks.sh', 'xtask/src/dex_test_ci.rs') }}

      - name: Restore DexKit desktop cache
        id: dexkit-cache
        uses: actions/cache/restore@v6
        with:
          path: .wekit/dex-test/source
          key: dexkit-desktop-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', 'xtask/src/dex_test.rs') }}

      - name: Generate supported APK manifest
        run: |
          ./x dex-test-ci sources \
            --doc docs/getting-started.md \
            --output "$RUNNER_TEMP/wekit-dex-test-sources.json"
          test "$(jq '.sources | length' "$RUNNER_TEMP/wekit-dex-test-sources.json")" -gt 0

      - name: Download supported WeChat APKs
        id: apks
        run: |
          chmod +x .github/scripts/download-dex-test-apks.sh
          set +e
          .github/scripts/download-dex-test-apks.sh \
            "$RUNNER_TEMP/wekit-dex-test-sources.json" \
            "$RUNNER_TEMP/wekit-dex-test-apks" \
            --failures-out "$RUNNER_TEMP/wekit-dex-test-download-failures.txt" \
            > "$RUNNER_TEMP/wekit-dex-test-apks.txt"
          download_status=$?
          set -e
          if [[ -s "$RUNNER_TEMP/wekit-dex-test-download-failures.txt" ]]; then
            while IFS= read -r failed_apk; do
              echo "::warning::failed to download $failed_apk; skipping its dex resolution"
            done < "$RUNNER_TEMP/wekit-dex-test-download-failures.txt"
          fi
          if [[ -s "$RUNNER_TEMP/wekit-dex-test-apks.txt" ]]; then
            mapfile -t downloaded_apks < "$RUNNER_TEMP/wekit-dex-test-apks.txt"
            echo "apk-count=${#downloaded_apks[@]}" >> "$GITHUB_OUTPUT"
          else
            echo "apk-count=0" >> "$GITHUB_OUTPUT"
          fi
          if [[ $download_status -ne 0 ]]; then
            echo "::error::download script failed with status $download_status"
            exit 1
          fi

      - name: Run desktop Dex resolution
        id: dex-resolution
        if: steps.apks.outcome == 'success' && fromJSON(steps.apks.outputs.apk-count || '0') > 0
        run: |
          mapfile -t apks < "$RUNNER_TEMP/wekit-dex-test-apks.txt"
          args=()
          for apk in "${apks[@]}"; do
            args+=(--apk "$apk")
          done
          set +e
          ./x dex-test "${args[@]}" --output-dir dex-test-results/ci
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test -n "$(find dex-test-results/ci -mindepth 2 -maxdepth 2 -name summary.json -print -quit)"

      - name: Check Dex resolution reports
        id: report-check
        if: always()
        run: |
          if test -n "$(find dex-test-results/ci -mindepth 2 -maxdepth 2 -name summary.json -print -quit)"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Dex resolution reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wekit-dex-test-reports
          path: dex-test-results/ci
          if-no-files-found: warn

      - name: Save fixed WeChat APKs
        if: always() && steps.apks.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/wekit-dex-test-apks
          key: ${{ steps.apk-cache.outputs.cache-primary-key }}

      - name: Save DexKit desktop cache
        if: always() && steps.dex-resolution.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .wekit/dex-test/source
          key: ${{ steps.dexkit-cache.outputs.cache-primary-key }}

      - name: Enforce Dex resolution result
        if: always()
        env:
          DEX_TEST_STATUS: ${{ steps.dex-resolution.outputs.status }}
        run: |
          test -n "$DEX_TEST_STATUS"
          test "$DEX_TEST_STATUS" -eq 0

  release-dex-test:
    needs: dex-test
    runs-on: ubuntu-latest
    if: ${{ always() && github.repository == 'Ujhhgtg/WeKit-Dev' && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.dex-test.outputs.reports-available == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Download Dex resolution reports
        uses: actions/download-artifact@v8
        with:
          name: wekit-dex-test-reports
          path: dex-test-results/ci

      - name: Stage successful Release assets
        id: stage
        run: |
          run_dir=$(dirname "$(find dex-test-results/ci -mindepth 2 -maxdepth 2 -name summary.json -print -quit)")
          test -n "$run_dir"
          ./x dex-test-ci stage-release \
            --run-dir "$run_dir" \
            --output-dir dist/dex-test-release \
            --sha "${{ github.sha }}"
          if [[ -s dist/dex-test-release/assets.txt ]]; then
            echo "has-assets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-assets=false" >> "$GITHUB_OUTPUT"
            echo "No host passed; leaving the Dex-Test Release unchanged."
          fi

      - name: Create or update Dex Test release
        if: steps.stage.outputs.has-assets == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if gh release view Dex-Test --repo Ujhhgtg/WeKit >/dev/null 2>&1; then
            gh release edit Dex-Test --repo Ujhhgtg/WeKit \
              --title "Dex Test" \
              --prerelease \
              --notes-file dist/dex-test-release/release-notes.md
          else
            gh release create Dex-Test \
              --repo Ujhhgtg/WeKit \
              --title "Dex Test" \
              --prerelease \
              --notes-file dist/dex-test-release/release-notes.md
          fi

          upload=(dist/dex-test-release/summary.json)
          while IFS= read -r asset; do
            [[ -n "$asset" ]] && upload+=("dist/dex-test-release/$asset")
          done < dist/dex-test-release/assets.txt
          gh release upload Dex-Test --repo Ujhhgtg/WeKit "${upload[@]}" --clobber

  extensions-changes:
    runs-on: ubuntu-latest
    if: github.repository == 'Ujhhgtg/WeKit-Dev' && github.event_name == 'push'
    outputs:
      changed: ${{ steps.filter.outputs.extensions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect extension pack input changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            extensions:
              - 'extension-packs/**'
              - 'extensions/**'
              - 'libs/python-runtime-api/**'
              - 'app/src/main/go/**'
              - 'app/src/main/rust/**'
              - 'patches/proot/**'
              - 'third_party/proot-static'
              - 'xtask/**'
              - 'buildSrc/**'
              - 'gradle/**'
              - 'settings.gradle.kts'
              - 'app/build.gradle.kts'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  build-extensions:
    needs: extensions-changes
    runs-on: ubuntu-latest
    # This dedicated publishing job is the only path that downloads the Arch rootfs.
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.publish_extensions) || needs.extensions-changes.outputs.changed == 'true' || needs.extensions-changes.result == 'failure') }}
    concurrency:
      group: extensions-release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: app/src/main/go/wekit-cloudflared/go.mod
          cache: true
          cache-dependency-path: app/src/main/go/wekit-cloudflared/go.sum

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: false

      - name: Install system dependencies
        # glslc compiles the llama.cpp Vulkan shaders for the llama-native pack.
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib glslc

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Install Android NDK
        run: |
          NDK_VERSION=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          MIN_SDK=$(sed -n 's/^minSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          NDK_BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android$MIN_SDK-clang"
          test -x "$NDK_BIN/llvm-strip"

      - name: Prepare PRoot cache key
        id: proot_cache_inputs
        run: |
          echo "commit=$(git -C third_party/proot-static rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(sed -n 's/^ndk = \"\(.*\)\"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
          echo "min_sdk=$(sed -n 's/^minSdk = \"\(.*\)\"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - name: Cache PRoot build
        uses: actions/cache@v6
        with:
          path: target/proot-static
          key: proot-${{ runner.os }}-${{ runner.arch }}-${{ steps.proot_cache_inputs.outputs.commit }}-${{ steps.proot_cache_inputs.outputs.ndk }}-${{ steps.proot_cache_inputs.outputs.min_sdk }}-${{ hashFiles('patches/proot/android-ptrace-events.patch', 'third_party/proot-static/tools/build-static-aarch64.sh') }}
          restore-keys: |
            proot-${{ runner.os }}-${{ runner.arch }}-

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target

      - name: Build packs
        env:
          WEKIT_ARCH_ROOTFS: ${{ runner.temp }}/arch-pack/ArchLinuxARM-aarch64-rootfs.tar.gz
        run: |
          SOURCE=extension-packs/archlinux-arm64-sources.json
          ROOTFS_URL=$(jq -r '.rootfs.url' "$SOURCE")
          ROOTFS_MD5=$(jq -r '.rootfs.md5' "$SOURCE")
          ROOTFS_SHA256=$(jq -er '.rootfs.sha256 | select(test("^[0-9A-Fa-f]{64}$"))' "$SOURCE")
          ROOTFS_SIGNATURE_URL=$(jq -r '.rootfs.signature_url' "$SOURCE")
          SIGNING_FINGERPRINT=$(jq -r '.rootfs.signing_fingerprint' "$SOURCE")
          mkdir -p "$RUNNER_TEMP/arch-pack"
          curl --fail --location --retry 3 \
            "$ROOTFS_URL" \
            -o "$WEKIT_ARCH_ROOTFS"
          printf '%s  %s\n' "$ROOTFS_SHA256" "$WEKIT_ARCH_ROOTFS" | sha256sum --check --strict
          printf '%s  %s\n' "$ROOTFS_MD5" "$WEKIT_ARCH_ROOTFS" | md5sum --check --strict
          curl --fail --location --retry 3 \
            "$ROOTFS_SIGNATURE_URL" \
            -o "$WEKIT_ARCH_ROOTFS.sig"
          curl --fail --location --retry 3 \
            "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$SIGNING_FINGERPRINT" \
            -o "$RUNNER_TEMP/arch-pack/signing-key.asc"
          test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/arch-pack/signing-key.asc" | awk -F: '$1 == "fpr" { print $10; exit }')" = "$SIGNING_FINGERPRINT"
          gpg --batch --import "$RUNNER_TEMP/arch-pack/signing-key.asc"
          gpg --batch --verify "$WEKIT_ARCH_ROOTFS.sig" "$WEKIT_ARCH_ROOTFS"
          cargo xtask configure
          cargo xtask build --native-only --abi arm64-v8a
          cargo xtask extensions pack

      - name: Skip if assets already published
        id: published
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          current_assets=$(
            for f in dist/extensions/*; do
              printf '%s\tsha256:%s\n' "$(basename "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
            done | sort
          )
          published_assets=$(
            gh api "repos/Ujhhgtg/WeKit/releases/tags/Extensions" \
              --jq '.assets[] | [.name, .digest] | @tsv' 2>/dev/null | sort || true
          )
          if [[ "$current_assets" == "$published_assets" ]]; then
            skip=true
          else
            skip=false
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Create Extensions release if missing
        if: steps.published.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if ! gh release view Extensions --repo Ujhhgtg/WeKit >/dev/null 2>&1; then
            gh release create Extensions \
              --repo Ujhhgtg/WeKit \
              --title "Extensions" \
              --prerelease \
              --notes "扩展包资产。manifest.json 为最新版本索引, 本体按索引下载并校验 SHA-256。"
          fi

      - name: Upload pack assets
        if: steps.published.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          shopt -s nullglob
          pack_assets=()
          for asset in dist/extensions/*; do
            [[ "$asset" == dist/extensions/manifest.json ]] || pack_assets+=("$asset")
          done
          (( ${#pack_assets[@]} > 0 ))
          gh release upload Extensions --repo Ujhhgtg/WeKit \
            "${pack_assets[@]}" \
            --clobber
          gh release upload Extensions --repo Ujhhgtg/WeKit dist/extensions/manifest.json --clobber

      - name: Remove stale pack assets
        if: steps.published.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          shopt -s nullglob
          current_files=(dist/extensions/*)
          (( ${#current_files[@]} > 0 ))
          published_assets=$(gh release view Extensions --repo Ujhhgtg/WeKit --json assets --jq '.assets[].name')

          while IFS= read -r published_asset; do
            [[ -z "$published_asset" ]] && continue
            keep=false
            for current_file in "${current_files[@]}"; do
              if [[ "$published_asset" == "$(basename "$current_file")" ]]; then
                keep=true
                break
              fi
            done
            if [[ "$keep" == false ]]; then
              gh release delete-asset Extensions --repo Ujhhgtg/WeKit "$published_asset" --yes
            fi
          done <<< "$published_assets"

  release-ci:
    needs: [build, build_zygisk]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build.result == 'success' && github.repository == 'Ujhhgtg/WeKit-Dev' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: wekit-apk
          path: artifacts

      - name: Download Zygisk artifact
        if: ${{ needs.build_zygisk.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: wekit-zygisk
          path: artifacts

      - name: Delete existing CI release (if exists)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release delete CI --repo Ujhhgtg/WeKit --yes || true
          gh api -X DELETE repos/Ujhhgtg/WeKit/git/refs/tags/CI || true

      - name: Generate update.json
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          GIT_HASH=$(git rev-parse --short HEAD)

          cat > artifacts/update.json <<EOF
          {
            "versionCode": ${COMMIT_COUNT},
            "versionName": "git+${GIT_HASH}",
            "commit": "${GIT_HASH}"
          }
          EOF

          echo "Generated update.json:"
          cat artifacts/update.json

      - name: Create CI release on WeKit and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "本 Release 始终包含最新的 CI 构建产物, 便于未登录 GitHub 的用户下载模块或模块内置更新器更新"
            echo ""
            echo "提交 SHA: \`${COMMIT_SHA}\`"
            echo ""
            echo "提交消息:"
            echo '```'
            echo "${COMMIT_MESSAGE}"
            echo '```'
          } > "$RUNNER_TEMP/ci-notes.md"

          gh release create CI \
            --repo Ujhhgtg/WeKit \
            --title "CI" \
            --notes-file "$RUNNER_TEMP/ci-notes.md" \
            artifacts/*

  upload-telegram:
    needs: [build, build_zygisk]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build.result == 'success' && github.repository == 'Ujhhgtg/WeKit-Dev' && github.event_name == 'workflow_dispatch' }}
    services:
      telegram-bot-api:
        image: aiogram/telegram-bot-api:latest
        env:
          TELEGRAM_API_ID: "21724"
          TELEGRAM_API_HASH: "3e0cb5efcd52300aec5994fdfc5bdc16"
          TELEGRAM_STATISTICS: 1
        ports:
          - 8081:8081

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: wekit-apk
          path: artifacts

      - name: Download Zygisk artifact
        if: ${{ needs.build_zygisk.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: wekit-zygisk
          path: artifacts

      - name: Wait for Telegram API
        run: |
          until curl -s http://localhost:8081 > /dev/null; do
          echo "Waiting for Telegram API server..."
          sleep 1
          done

      - name: Send build artifacts via Telegram API
        env:
          BOT_TOKEN:         ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID:           ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          SHA:               ${{ github.sha }}
          COMMIT_AUTHOR:     ${{ github.event.head_commit.author.name || github.actor }}
          COMMIT_MESSAGE:    ${{ github.event.head_commit.message || 'Manual Build' }}
          REPO:              ${{ github.repository }}
        run: |
          caption="🎉 *检测到新的 GitHub 推送！*
          *Commit SHA:* \`${SHA}\`
          \`\`\`
          ${COMMIT_MESSAGE}
          \`\`\`
          *提交者* \`${COMMIT_AUTHOR}\`
          [查看详情](https://github.com/${REPO}/commit/${SHA})"
          
          shopt -s nullglob
          artifacts=(artifacts/*.apk artifacts/*.zip)
          
          echo "${artifacts[@]}"
          
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No build artifacts found"
            exit 1
          elif [ ${#artifacts[@]} -eq 1 ]; then
            # Single APK — use sendDocument (supports caption)
            curl -s -X POST "http://localhost:8081/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="${CHAT_ID}" \
              -F document=@"${artifacts[0]}" \
              -F caption="${caption}" \
              -F parse_mode=Markdown
          else
            media_json="["
            form_args=()
            for i in "${!artifacts[@]}"; do
              artifact="${artifacts[$i]}"
              name="artifact${i}"
              form_args+=(-F "${name}=@${artifact}")
          
              if [ $i -gt 0 ]; then media_json+=","; fi
          
              if [ $i -eq $(( ${#artifacts[@]} - 1 )) ]; then
                media_json+="{\"type\":\"document\",\"media\":\"attach://${name}\",\"caption\":\"${caption}\",\"parse_mode\":\"Markdown\"}"
              else
                media_json+="{\"type\":\"document\",\"media\":\"attach://${name}\"}"
              fi
            done
            media_json+="]"
          
            echo $media_json
          
            curl -s -X POST "http://localhost:8081/bot${BOT_TOKEN}/sendMediaGroup" \
              -F chat_id="${CHAT_ID}" \
              -F message_thread_id="${MESSAGE_THREAD_ID}" \
              -F media="${media_json}" \
              "${form_args[@]}"
          fi
