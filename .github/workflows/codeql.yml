name: CodeQL

on:
  push:
    branches:
      - master
      - dev

  pull_request:
    branches:
      - master
      - dev

  # Periodically rerun the latest CodeQL queries even when the source tree
  # itself has not changed.
  schedule:
    - cron: "17 3 * * 2"

  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      # Required by github/codeql-action/analyze.
      security-events: write

      # Required to check out the repository.
      contents: read

      # Gradle resolves the Miuix dependency from GitHub Packages.
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub Actions is interpreted; no build is required.
          - language: actions
            build-mode: none
            fetch-depth: 1

          # Modern CodeQL Rust analysis uses rust-analyzer and does not need
          # a full Cargo build.
          - language: rust
            build-mode: none
            fetch-depth: 1

          # Kotlin requires a real build. Autobuild cannot reproduce WeKit's
          # Gradle environment, so build the relevant variant explicitly.
          - language: java-kotlin
            build-mode: manual
            fetch-depth: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.fetch-depth }}

      # Do not use `submodules: recursive` here. The repository also contains
      # large/native-only submodules such as cloudflared and proot-static,
      # which are irrelevant to Java/Kotlin analysis.
      #
      # These are the only submodules currently included as Gradle projects.
      - name: Checkout Gradle submodules
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          git submodule update --init --recursive -- \
            libs/common/bsh \
            libs/common/reflekt

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        if: matrix.language == 'java-kotlin'
        run: chmod +x gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compile Java/Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --no-build-cache \
            --stacktrace \
            :app:compileStandardDebugSources

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
